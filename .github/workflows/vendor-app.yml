name: Build WinHDR Android APK

on:
  push:
    branches:
      - vendor-app-independent
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/vendor-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WinHDR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Android project and WinHDR UI
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f app/build.gradle
          test -f app/src/main/java/com/winlator/WinHDRHomeFragment.java
          test -f app/src/main/res/layout/fragment_winhdr_home.xml
          grep -q 'menu_item_home' app/src/main/res/menu/main_menu.xml
          echo "Project and WinHDR UI files verified."

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHDR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
