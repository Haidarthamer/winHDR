name: Vendor Winlator app into WinHDR

on:
  push:
    paths:
      - ".github/workflows/vendor-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WinHDR repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vendor pinned app source and apply native UI
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init app
          pinned="$(git -C app rev-parse HEAD)"
          expected="a030f552f452158a2db64fdb32b490fa19c0b48d"
          if [[ "$pinned" != "$expected" ]]; then
            echo "Unexpected app submodule commit: $pinned (expected $expected)" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          cp -a app/. "$tmp/"
          rm -rf "$tmp/.git"
          git checkout -B vendor-app-independent
          git rm --cached -f app
          rm -rf app
          mkdir app
          cp -a "$tmp/." app/
          rm -rf "$tmp"

          python3 - <<'PY'
          from pathlib import Path
          p = Path(".gitmodules")
          if p.exists():
              lines = p.read_text().splitlines(keepends=True)
              out, skip = [], False
              for line in lines:
                  if line.strip() == '[submodule "app"]':
                      skip = True
                      continue
                  if skip and line.lstrip().startswith("[submodule "):
                      skip = False
                  if not skip:
                      out.append(line)
              result = "".join(out).strip() + "\n"
              if result.strip():
                  p.write_text(result)
              else:
                  p.unlink()
          PY

          patch="arena-native-ui/WinHDR-native-android-ui.patch"
          test -f "$patch"
          (cd app/app && git apply --check "../../$patch")
          (cd app/app && git apply "../../$patch")
          test -f app/app/src/main/java/com/winlator/WinHDRHomeFragment.java
          test -f app/app/src/main/res/layout/fragment_winhdr_home.xml
          grep -q 'menu_item_home' app/app/src/main/res/menu/main_menu.xml
          grep -q 'WinHDRHomeFragment' app/app/src/main/java/com/winlator/MainActivity.java

          if git ls-files --stage app | grep -q '^160000 '; then
            echo "ERROR: app is still indexed as a submodule." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .gitmodules app
          git commit -m "Vendor Winlator app source and integrate WinHDR native UI"
          git push --force origin HEAD:vendor-app-independent

      - name: Verify normal tracked files and UI
        run: |
          set -euo pipefail
          git fetch origin vendor-app-independent
          git ls-tree origin/vendor-app-independent app
          if git ls-tree origin/vendor-app-independent app | grep -q 'commit '; then
            echo "ERROR: app is still a submodule." >&2
            exit 1
          fi
          git show origin/vendor-app-independent:app/app/src/main/res/menu/main_menu.xml | grep -q 'menu_item_home'
          git show origin/vendor-app-independent:app/app/src/main/java/com/winlator/WinHDRHomeFragment.java >/dev/null
          echo "Vendored source and native UI verified."

      - name: Build Android debug APK
        working-directory: app
        run: |
          set -euo pipefail
          test -f ./gradlew
          bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinHDR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
