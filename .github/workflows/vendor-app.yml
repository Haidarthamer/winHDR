name: Vendor Winlator app into WinHDR

on:
  push:
    paths:
      - ".github/workflows/vendor-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WinHDR repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vendor pinned app source and integrate native UI
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init app
          pinned="$(git -C app rev-parse HEAD)"
          expected="a030f552f452158a2db64fdb32b490fa19c0b48d"
          if [[ "$pinned" != "$expected" ]]; then
            echo "Unexpected app submodule commit: $pinned (expected $expected)" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          cp -a app/. "$tmp/"
          rm -rf "$tmp/.git"
          git checkout -B vendor-app-independent
          git rm --cached -f app
          rm -rf app
          mkdir app
          cp -a "$tmp/." app/
          rm -rf "$tmp"

          python3 - <<'PY'
          from pathlib import Path
          p = Path(".gitmodules")
          if p.exists():
              lines = p.read_text().splitlines(keepends=True)
              out, skip = [], False
              for line in lines:
                  if line.strip() == '[submodule "app"]':
                      skip = True
                      continue
                  if skip and line.lstrip().startswith("[submodule "):
                      skip = False
                  if not skip:
                      out.append(line)
              result = "".join(out).strip() + "\n"
              if result.strip():
                  p.write_text(result)
              else:
                  p.unlink()

          patch = Path("arena-native-ui/WinHDR-native-android-ui.patch").read_text()
          for section in patch.split("diff --git ")[1:]:
              lines = section.splitlines()
              if "new file mode" not in section:
                  continue
              dest_line = next((line for line in lines if line.startswith("+++ b/")), None)
              if not dest_line:
                  raise SystemExit("New UI patch section is missing destination path")
              target = Path("app/app") / dest_line[len("+++ b/"):]
              target.parent.mkdir(parents=True, exist_ok=True)
              content_lines, in_hunk = [], False
              for line in lines:
                  if line.startswith("@@"):
                      in_hunk = True
                      continue
                  if in_hunk and line.startswith("+") and not line.startswith("+++"):
                      content_lines.append(line[1:])
                  elif in_hunk and line.startswith("\\"):
                      continue
              target.write_text("\n".join(content_lines) + "\n")

          main = Path("app/app/src/main/java/com/winlator/MainActivity.java")
          source = main.read_text()
          old = "int menuItemId = selectedMenuItemId > 0 ? selectedMenuItemId : (showShortcutsFirst ? R.id.menu_item_shortcuts : R.id.menu_item_containers);"
          if "R.id.menu_item_home;" not in source:
              if old not in source:
                  raise SystemExit("Could not locate default navigation selection in MainActivity.java")
              source = source.replace(old, "int menuItemId = selectedMenuItemId > 0 ? selectedMenuItemId : R.id.menu_item_home;", 1)
          if "case R.id.menu_item_home:" not in source:
              marker = "        switch (item.getItemId()) {"
              if marker not in source:
                  raise SystemExit("Could not locate navigation switch in MainActivity.java")
              source = source.replace(marker, marker + "\n            case R.id.menu_item_home:\n                showFragment(new WinHDRHomeFragment());\n                break;", 1)
          main.write_text(source)

          menu = Path("app/app/src/main/res/menu/main_menu.xml")
          menu_text = menu.read_text()
          if "menu_item_home" not in menu_text:
              marker = '    <group android:checkableBehavior="single">'
              if marker not in menu_text:
                  raise SystemExit("Could not locate navigation menu group")
              menu_text = menu_text.replace(marker, marker + '\n        <item android:icon="@drawable/icon_container" android:id="@+id/menu_item_home" android:title="WinHDR Home" />', 1)
          menu.write_text(menu_text)

          for rel in [
              "src/main/java/com/winlator/WinHDRHomeFragment.java",
              "src/main/res/layout/fragment_winhdr_home.xml",
              "src/main/res/drawable/winhdr_home_card.xml",
          ]:
              if not (Path("app/app") / rel).is_file():
                  raise SystemExit(f"Missing UI file after integration: {rel}")
          if "WinHDRHomeFragment" not in main.read_text() or "menu_item_home" not in menu.read_text():
              raise SystemExit("UI navigation integration verification failed")
          print("Native UI files and navigation integrated.")
          PY

          if git ls-files --stage app | grep -q '^160000 '; then
            echo "ERROR: app is still indexed as a submodule." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .gitmodules app
          git commit -m "Vendor Winlator app source and integrate WinHDR native UI"
          git push --force origin HEAD:vendor-app-independent

      - name: Verify normal tracked files and UI
        run: |
          set -euo pipefail
          git fetch origin vendor-app-independent
          git ls-tree origin/vendor-app-independent app
          if git ls-tree origin/vendor-app-independent app | grep -q 'commit '; then
            echo "ERROR: app is still a submodule." >&2
            exit 1
          fi
          git show origin/vendor-app-independent:app/app/src/main/res/menu/main_menu.xml | grep -q 'menu_item_home'
          git show origin/vendor-app-independent:app/app/src/main/java/com/winlator/WinHDRHomeFragment.java >/dev/null
          echo "Vendored source and native UI verified."

      - name: Build Android debug APK
        working-directory: app
        run: |
          set -euo pipefail
          test -f ./gradlew
          bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinHDR-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
